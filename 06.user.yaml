- name: Configure user Srever
  hosts: user
  become: yes
  tasks:

  - name: disable nodejs module
    # ansible.builtin.command: "yum module disable nodejs -y"
    # register: result
    # ignore_errors: yes
    command: dnf module disable nodejs -y

  - name: enable nodejs module
    command: dnf module enable nodejs:24 -y

  - name: install nodejs
    dnf:
      name: nodejs
      state: present

  - name: create app user
    user:
      name: roboshop
      create_home: false
      home: /app
      system: true
      shell: /sbin/nologin
      comment: "Roboshop System User"

  - name: delete exisiting app directory
    file:
      path: /app
      state: absent

  - name: remove user.zip
    file:
      path: /tmp/user.zip
      state: absent

  - name: create app directory
    file:
      path: /app
      state: directory

  - name: download user zip
    get_url:
      url: "https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/user-v4.zip"
      dest: /tmp/user.zip            
  

  - name: unzip user zip
    unarchive:
      src: /tmp/user.zip
      dest: /app
      remote_src: yes 

  - name: install nodejs dependencies
    community.general.npm:
      path: /app

  - name: copy user service file
    ansible.builtin.template:
      src: user.service.j2  
      dest: /etc/systemd/system/user.service

  
  - name: Reload systemd daemon
    ansible.builtin.systemd_service:
      daemon_reload: true

  - name: Start and Restart user service
    service:
      name: user
      state: restarted
      enabled: yes    
  

