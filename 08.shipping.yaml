- name: Configure Shipping Module
  hosts: shipping
  become: yes
  tasks:

  - name: enable maven 3.9
    command: dnf module enable maven:3.9 -y

  - name: install maven and java25
    dnf:
      name:
      - maven
      - java-25-openjdk-devel
      - maven-openjdk25
      - mysql #installing this so that we dont need to set $JAVA_HOME
      state: present

  # - name: find the java-25 path
  #   shell: readlink -f $(ls /usr/lib/jvm/java-25-openjdk/bin/java | head -1)  
  #   register: java25

  # - name:  print the outpu
  #   debug:
  #     msg: "{{ java25}}"  


  # - name: Set default Java version to Java 25
  #   community.general.alternatives:
  #     name: JAVA_HOME
  #     path: /usr/lib/jvm/java-25-openjdk/bin/java # Double-check if your exact path matches this binary
     

  # - name: make java25 as default
  #   command: alternatives --config java {{ java25.stdout }}

  # - name: set JAVA_HOME
  #   copy:
  #     content: "export JAVA_HOME={{ java25.stdout | dirname }}"
  #     dest: /etc/profile.d/java.sh

  - name: create app user
    user:
      name: roboshop
      create_home: false
      home: /app
      system: true
      shell: /sbin/nologin
      comment: "Roboshop System User"

  - name: delete exisiting app directory
    file:
      path: /app
      state: absent

  - name: remove shipping.zip
    file:
      path: /tmp/shipping.zip
      state: absent

  - name: create app directory
    file:
      path: /app
      state: directory

  - name: download shipping zip
    get_url:
      url: "https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/shipping-v4.zip"
      dest: /tmp/shipping.zip            
  

  - name: unzip shipping zip
    unarchive:
      src: /tmp/shipping.zip
      dest: /app
      remote_src: yes 

  - name: mvn withou $JAVA_HOME
    command: mvn --version
    args:
      chdir: /app
    register: mvn_default


  - name: print the java version without $JAVA_HOME
    debug:
      msg: "{{ mvn_default.stdout_lines }}"


  - name: build shipping
    command: mvn clean package
    args:
      chdir: /app

  - name: move shipping jar file
    command: mv target/shipping.jar shipping.jar
    args:
      chdir: /app

  - name: check the existance of cities data
    command: mysql -h "{{  mysql_host }}" -u root -pRoboShop@1 -N -B -e "SELECT COUNT(*) FROM cities.cities;"
    register: cities_count

  - name: print cities count
    debug:
      msg: "{{ cities_count }}"     

       
