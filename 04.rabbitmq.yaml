- name: Configure rabbitmq
  hosts: rabbitmq
  become: yes
  tasks:
  - name: copy repo file
    copy:
      src: rabbitmq.repo
      dest: /etc/yum.repos.d/rabbitmq.repo

  - name: install rabbitmq
    package:
      name: rabbitmq-server
      state: present

  - name: enable rabbitmq server
    service:
      name: rabbitmq-server
      state: started
      enabled: yes

