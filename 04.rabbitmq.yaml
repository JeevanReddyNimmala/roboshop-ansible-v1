- name: Configure rabbitmq
  hosts: rabbitmq
  become: yes
  tasks:
  - name: install rabbitmq
    package:
      name:rabbitmq-server
      state: present

  - name: enable rabbitmq server
    service:
      name: rabbitmq-server
      state: started
      enabled: yes

