- name: Configure Catalogue Srever
  hosts: catalogue
  become: yes
  tasks:

  - name: disable nodejs module
    # ansible.builtin.command: "yum module disable nodejs -y"
    # register: result
    # ignore_errors: yes
    command: dnf module disable nodejs -y

  - name: enable nodejs module
    command: dnf module enable nodejs:24 -y

  - name: install nodejs
    dnf:
      name: nodejs
      state: present

  - name: create app user
    user:
      name: roboshop
      create_home: false
      home: /app
      system: true
      shell: /sbin/nologin
      comment: "Roboshop System User"

  - name: delete exisiting app directory
    file:
      path: /app
      state: absent

  - name: remove catalogue.zip
    file:
      path: /tmp/catalogue.zip
      state: absent

  - name: create app directory
    file:
      path: /app
      state: directory

  - name: download catalogue zip
    get_url:
      url: "https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/catalogue-v4.zip"
      dest: /tmp/catalogue.zip            
  

  - name: unzip catalogue zip
    unarchive:
      src: /tmp/catalogue.zip
      dest: /app
      remote_src: yes 

  - name: install nodejs dependencies
    community.general.npm:
      path: /app

  - name: copy catalogue service file
    template:
      src: catalogue.service
      dest: /etc/systemd/system/catalogue.service
      remote_src: yes 

  - name: copy mongo repo
    copy:
      src: mongo.repo
      dest: /etc/yum.repos.d/mongo.repo

  - name: install mongodb client
    dnf:
      name: mongodb-mongosh
      state: present

  - name: check whether products loaded or not
    command:     


