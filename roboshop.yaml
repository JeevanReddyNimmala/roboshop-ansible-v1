- name: create EC2 instances and R54 record 
  hosts: localhost
  connection: local
  vars:
    instances: ["mongodb" , "redis" , "catalogue" , "mysql" , "rabbitmq"]
    action: create
    domain_name: jsrgroup.online
    ami_id: 0055977a6e828a4f4
  tasks:
    - name: create ec2 instances
      amazon.aws.ec2_instace:
      name: " roboshop-{{ item }}"
      image_id: "{{ ami_id }}"
      instance_type: t3.micro
      region: us-east-1
      security_groups:
        - roboshop-common
        - roboshop-{{ item  }}
      loop: "{{ instances }}"
      when: action == "create"
       