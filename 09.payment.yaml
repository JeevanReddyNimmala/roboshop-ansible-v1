- name: Configure payment module
  hosts: payment
  become: yes
  tasks:
  - name: install python 3.14
    dnf:
      name:
        - python3.14
        - python3.14-pip
      state: present 

  - name: create app user
    user:
      name: roboshop
      create_home: false
      home: /app
      system: true
      shell: /sbin/nologin
      comment: "Roboshop System User"

  - name: delete exisiting app directory
    file:
      path: /app
      state: absent

  - name: remove payment.zip
    file:
      path: /tmp/payment.zip
      state: absent

  - name: create app directory
    file:
      path: /app
      state: directory

  - name: download payment zip
    get_url:
      url: "https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/payment-v4.zip"
      dest: /tmp/payment.zip            
  

  - name: unzip payment zip
    unarchive:
      src: /tmp/payment.zip
      dest: /app
      remote_src: yes 

  - name: install dependencies in virtual environment
    ansible.builtin.pip:
      requirements: /app/requirements.txt
      virtualenv: /app/.venv
      virtualenv_command: python3 -m venv
   

  - name: copy payment service file
    ansible.builtin.template:
      src: payment.service
      dest: /etc/systemd/system/payment.service
  

  - name: Reload systemd daemon
    ansible.builtin.systemd_service:
      daemon_reload: true

  - name: Start and Restart Payment service
    service:
      name: payment
      state: restarted
      enabled: yes  